<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="yangGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C41E3A"/>
      <stop offset="100%" style="stop-color:#8B0000"/>
    </linearGradient>
    <linearGradient id="yinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  
  <!-- 外圈 -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="url(#yangGrad)" stroke-width="3"/>
  
  <!-- 太极图 -->
  <path d="M50 10 A40 40 0 0 1 50 90 A20 20 0 0 1 50 50 A20 20 0 0 0 50 10" fill="url(#yangGrad)"/>
  <path d="M50 10 A40 40 0 0 0 50 90 A20 20 0 0 0 50 50 A20 20 0 0 1 50 10" fill="url(#yinGrad)"/>
  
  <!-- 阴阳点 -->
  <circle cx="50" cy="30" r="6" fill="url(#yinGrad)"/>
  <circle cx="50" cy="70" r="6" fill="url(#yangGrad)"/>
  
  <!-- 八卦符号装饰 - 乾卦线条 -->
  <g stroke="#D4AF37" stroke-width="2" stroke-linecap="round">
    <line x1="20" y1="85" x2="35" y2="85"/>
    <line x1="65" y1="85" x2="80" y2="85"/>
  </g>
</svg>